<!DOCTYPE html>
<!-- preview.html：本地模拟 ChatGPT 宿主，加载 widget.html + sample.json -->
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;background:#888;font-family:system-ui}iframe{width:100%;border:0;display:block;background:#fff}#log{font:11px monospace;padding:6px;white-space:pre-wrap;color:#fff}</style></head>
<body>
<iframe id="f" src="../src/widget.html" style="height:700px"></iframe>
<div id="log"></div>
<script>
const f = document.getElementById("f");
const log = (s) => (document.getElementById("log").textContent += s + "\n");
window.addEventListener("message", async (e) => {
  const m = e.data; if (!m || m.jsonrpc !== "2.0") return;
  const reply = (result) => f.contentWindow.postMessage({ jsonrpc: "2.0", id: m.id, result }, "*");
  if (m.method === "ui/initialize") {
    reply({ protocolVersion: "2026-01-26", hostContext: { theme: new URLSearchParams(location.search).get("theme") || "light" } });
  } else if (m.method === "ui/notifications/initialized") {
    const data = await (await fetch("sample.json")).json();
    if (new URLSearchParams(location.search).has("stream")) {
      // 模拟模型逐步生成参数：每次多推几道菜
      const all = data.categories.flatMap((c, ci) => c.items.map((item) => [ci, item]));
      for (let k = 4; k < all.length; k += 12) {
        const categories = [];
        for (const [ci, item] of all.slice(0, k)) {
          const c = data.categories[ci];
          if (!categories[ci]) categories[ci] = { ...c, items: [] };
          categories[ci].items.push(item);
        }
        const partial = { ...data, categories: categories.filter(Boolean), card: undefined, requests: undefined };
        f.contentWindow.postMessage({ jsonrpc: "2.0", method: "ui/notifications/tool-input-partial", params: { arguments: partial } }, "*");
        await new Promise((r) => setTimeout(r, 150));
      }
    }
    f.contentWindow.postMessage({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: { structuredContent: data } }, "*");
  } else if (m.method === "ui/notifications/size-changed") {
    f.style.height = m.params.height + "px";
  } else if (m.id !== undefined) {
    log(m.method + " " + JSON.stringify(m.params).slice(0, 300));
    reply({});
  }
});
</script>
</body></html>
