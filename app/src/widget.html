<!DOCTYPE html>
<!-- widget.html：ChatGPT 内嵌菜单组件 -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #ffffff; --fg: #111418; --muted: #6b7280; --line: #e7e9ee; --chip: #f2f4f7;
    --accent: #e8553e; --accent-fg: #ffffff; --warn: #b42318; --card: #fffaf3;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1d20; --fg: #f3f4f6; --muted: #9ca3af; --line: #2e3035; --chip: #2a2c31;
      --card: #26231e; --warn: #f97066;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1d20; --fg: #f3f4f6; --muted: #9ca3af; --line: #2e3035; --chip: #2a2c31;
    --card: #26231e; --warn: #f97066;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-size: 15px; line-height: 1.35; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .hidden { display: none !important; }

  header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
  .title { font-weight: 650; font-size: 16px; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .search { margin-top: 8px; width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--chip); color: var(--fg); font: inherit; font-size: 14px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px; border-bottom: 1px solid var(--line);
    scrollbar-width: none; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { white-space: nowrap; padding: 6px 11px; border-radius: 999px; background: var(--chip); font-size: 13.5px; }
  .tab.on { background: var(--fg); color: var(--bg); }
  .tab .cnt { margin-left: 4px; font-size: 11.5px; opacity: .75; }

  #list { max-height: 520px; overflow-y: auto; }
  body.full #list { max-height: none; }
  .cat { padding: 10px 14px 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .row { display: flex; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .num { min-width: 28px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 1px; }
  .main { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .orig { color: var(--muted); font-size: 13px; }
  .desc { font-size: 13px; margin-top: 2px; }
  .name-row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .price { font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .need { color: var(--warn); font-size: 12.5px; margin-top: 3px; }
  .step { display: flex; align-items: center; gap: 6px; }
  .step button { width: 30px; height: 30px; border-radius: 50%; background: var(--chip); font-size: 18px; line-height: 1; }
  .step .plus { background: var(--accent); color: var(--accent-fg); }
  .step .q { min-width: 16px; text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; }

  .panel { padding: 4px 14px 10px 52px; border-bottom: 1px solid var(--line); background: var(--chip); }
  .line { padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .line:last-of-type { border-bottom: 0; }
  .line-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; }
  .chip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .chip.req { border-style: dashed; }
  .lab { font-size: 12px; color: var(--muted); align-self: center; margin-right: 2px; }
  .need-lab { color: var(--warn); }
  .split { margin-top: 8px; font-size: 13px; color: var(--accent); }
  .empty { padding: 24px 14px; color: var(--muted); text-align: center; }

  .bar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--bg); border-top: 1px solid var(--line); }
  .bar .sum { flex: 1; font-size: 13.5px; }
  .bar .sum b { font-size: 15px; }
  .btn { padding: 10px 16px; border-radius: 12px; background: var(--accent); color: var(--accent-fg); font-weight: 650; }
  .btn.ghost { background: var(--chip); color: var(--fg); }
  .btn:disabled { opacity: .45; cursor: default; }

  :root { --safe-top: 0px; --safe-bottom: 0px; }
  #cardView { padding: 0 14px; }
  .card-top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + var(--safe-top)) 0 10px; background: var(--bg); }
  .card-top button { color: var(--accent); font-size: 15px; padding: 4px 0; }
  .card-top span { color: var(--muted); font-size: 13px; }
  .waiter { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; }
  .w-open { font-size: 21px; font-weight: 700; line-height: 1.3; }
  .w-en { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .w-allergy { margin-top: 10px; font-weight: 650; color: var(--warn); font-size: 17px; }
  .w-items { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .w-item { font-size: 20px; font-weight: 650; padding: 6px 0; }
  .w-sub { font-size: 16px; font-weight: 500; padding-left: 18px; }
  .confirm { margin-top: 14px; font-size: 13.5px; }
  .confirm table { width: 100%; border-collapse: collapse; }
  .confirm td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .confirm td.r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .confirm .tot { font-weight: 650; }
  .notes { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; position: sticky; bottom: 0;
    padding: 10px 0 calc(10px + var(--safe-bottom)); background: var(--bg); }
  .actions .btn { flex: 1; }
  .placed { padding: 8px 14px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  .placed button { color: var(--accent); font-size: 13px; }
</style>
</head>
<body>
<div id="loading" class="empty">…</div>

<div id="menuView" class="hidden">
  <header>
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
    <input class="search" id="search" type="search" autocomplete="off">
  </header>
  <div class="placed hidden" id="placed"><span id="placedText"></span><button id="billBtn"></button></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="list"></div>
  <div class="bar">
    <div class="sum" id="sum"></div>
    <button class="btn" id="cardBtn"></button>
  </div>
</div>

<div id="cardView" class="hidden">
  <div class="card-top"><button data-act="back" id="topBack"></button><span id="topLabel"></span></div>
  <div class="waiter" id="waiter"></div>
  <div class="confirm" id="confirm"></div>
  <div class="actions" id="actions"></div>
</div>

<script type="module">
const zh = (document.documentElement.lang || navigator.language || "zh").toLowerCase().startsWith("zh");
const T = zh ? {
  required: "必选", optional: "可选", search: "搜索菜名或编号", items: "项", cats: "类", selected: "已选", none: "还没选菜", total: "小计", card: "生成卡片",
  pick: "请选择", back: "返回修改", placedBtn: "服务员已记下", placedLine: (n, s) => `已下单 ${n} 项 · ${s}`,
  bill: "结账卡片", close: "返回", showWaiter: "给服务员看", portion: (i) => `第 ${i} 份`, split: "+ 另一份不同要求", incomplete: "部分价格未知，合计不完整",
  noResult: "没有找到", all: "全部", qty: "数量", done: "完成", fullscreen: "全屏",
} : {
  required: "Required", optional: "Optional", search: "Search name or number", items: "items", cats: "categories", selected: "Selected", none: "Nothing selected", total: "Subtotal", card: "Waiter card",
  pick: "Choose", back: "Edit", placedBtn: "Waiter has it", placedLine: (n, s) => `Ordered ${n} · ${s}`,
  bill: "Bill card", close: "Back", showWaiter: "Show the waiter", portion: (i) => `Portion ${i}`, split: "+ Another with different requests", incomplete: "Some prices unknown; total incomplete",
  noResult: "No match", all: "All", qty: "Qty", done: "Done", fullscreen: "Full screen",
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---- MCP Apps bridge ----
let rpcId = 0;
const pending = new Map();
const notify = (method, params) => window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
const request = (method, params) => new Promise((resolve, reject) => {
  const id = ++rpcId;
  pending.set(id, { resolve, reject });
  window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
});
window.addEventListener("message", (e) => {
  if (e.source !== window.parent) return;
  const m = e.data;
  if (!m || m.jsonrpc !== "2.0") return;
  if (m.id !== undefined && pending.has(m.id)) {
    const p = pending.get(m.id); pending.delete(m.id);
    m.error ? p.reject(m.error) : p.resolve(m.result);
    return;
  }
  if (m.method === "ui/notifications/tool-result") load(m.params?.structuredContent);
  else if (m.method === "ui/notifications/tool-input") load(m.params?.arguments);
  else if (m.method === "ui/notifications/host-context-changed") applyTheme(m.params);
}, { passive: true });

const ready = request("ui/initialize", {
  appInfo: { name: "menu-helper", version: "1.0.0" },
  appCapabilities: {},
  protocolVersion: "2026-01-26",
}).then((r) => { applyTheme(r?.hostContext); notify("ui/notifications/initialized", {}); }).catch(() => {});

let hostInsets = null;
let displayMode = "inline";
function applyTheme(ctx) {
  const t = ctx?.theme;
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  if (ctx?.safeAreaInsets) hostInsets = ctx.safeAreaInsets;
  if (ctx?.displayMode) displayMode = ctx.displayMode;
  applyInsets();
}
// 全屏时避开状态栏和宿主顶栏；宿主没给安全区时留 48px
function applyInsets() {
  const oa = window.openai || {};
  const ins = hostInsets || oa.safeArea?.insets || null;
  const mode = oa.displayMode || displayMode;
  const full = mode === "fullscreen";
  document.body.classList.toggle("full", full);
  const top = ins?.top ?? 0;
  const root = document.documentElement.style;
  root.setProperty("--safe-top", full ? `max(env(safe-area-inset-top), ${Math.max(top, ins ? 0 : 48)}px)` : "0px");
  root.setProperty("--safe-bottom", full ? `max(env(safe-area-inset-bottom), ${ins?.bottom ?? 0}px)` : "0px");
}
window.addEventListener("openai:set_globals", applyInsets);

new ResizeObserver(() => {
  notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
}).observe(document.documentElement);

// ---- State ----
let menu = null;
let byN = new Map();
let lines = [];      // 当前未下单：{ n, qty, opt: 必选下标|null, ext: [可选下标], reqs: [通用要求下标] }
let placed = [];     // 已下单：同结构，round 表示第几轮
let round = 0;
let tab = 0;         // 分类下标；-1 = 已选
let query = "";
const open = new Set();
let view = "menu";   // menu | card | bill

// 状态按菜单指纹存取，换菜单不会带入旧选择
const menuKey = () => `${menu.restaurant}|${byN.size}|${[...byN.keys()].join(",")}`;
function saveState() {
  try { window.openai?.setWidgetState?.({ key: menuKey(), lines, placed, round }); } catch {}
}
function restoreState() {
  try {
    const s = window.openai?.widgetState;
    if (s && s.key === menuKey() && Array.isArray(s.lines)) { lines = s.lines; placed = s.placed || []; round = s.round || 0; }
  } catch {}
}

let loadedSig = "";
function load(data) {
  if (!data || !Array.isArray(data.categories)) return;
  const sig = JSON.stringify(data);
  if (sig === loadedSig) return;
  loadedSig = sig;
  const oldKey = menu ? menuKey() : "";
  menu = data;
  byN = new Map();
  for (const c of menu.categories) for (const it of c.items) if (it && typeof it.n === "number") byN.set(it.n, it);
  if (menuKey() !== oldKey) { lines = []; placed = []; round = 0; tab = 0; open.clear(); restoreState(); }
  lines = lines.filter((l) => byN.has(l.n));
  $("loading").classList.add("hidden");
  view = "menu";
  render();
}

// ---- Money ----
function money(v) {
  if (v == null || isNaN(v)) return "?";
  try { return new Intl.NumberFormat(zh ? "zh-CN" : undefined, { style: "currency", currency: menu.currency }).format(v); }
  catch { return `${v.toFixed(2)} ${menu.currency}`; }
}
function totals(ls) {
  let sum = 0, unknown = false, count = 0;
  for (const l of ls) {
    const it = byN.get(l.n); if (!it) continue;
    count += l.qty;
    if (typeof it.value === "number") sum += it.value * l.qty; else unknown = true;
  }
  return { sum, unknown, count };
}

const qtyOf = (n) => lines.filter((l) => l.n === n).reduce((s, l) => s + l.qty, 0);
const needsChoice = (l) => (byN.get(l.n)?.options?.length || 0) > 0 && l.opt == null;

function add(n) {
  const it = byN.get(n);
  const ls = lines.filter((l) => l.n === n);
  if (ls.length) ls[ls.length - 1].qty++;
  else lines.push({ n, qty: 1, opt: null, ext: [], reqs: [] });
  if (it.options?.length || it.extras?.length) open.add(n);
  changed();
}
function sub(n) {
  const ls = lines.filter((l) => l.n === n);
  if (!ls.length) return;
  const l = ls[ls.length - 1];
  l.qty--;
  if (l.qty <= 0) lines.splice(lines.indexOf(l), 1);
  if (!qtyOf(n)) open.delete(n);
  changed();
}
function changed() { saveState(); render(); }

// ---- Render: menu ----
function render() {
  $("menuView").classList.toggle("hidden", view !== "menu");
  $("cardView").classList.toggle("hidden", view === "menu");
  if (view === "menu") renderMenu(); else renderCard();
}

function renderMenu() {
  const total = menu.categories.reduce((s, c) => s + c.items.length, 0);
  $("title").textContent = `📍 ${menu.restaurant}`;
  $("sub").textContent = `${menu.currency} · ${menu.categories.length} ${T.cats} · ${total} ${T.items}`;
  $("search").placeholder = T.search;

  const nSel = lines.reduce((s, l) => s + l.qty, 0);
  $("tabs").innerHTML = (nSel ? `<button class="tab ${tab === -1 ? "on" : ""}" data-tab="-1">🧾 ${T.selected}<span class="cnt">${nSel}</span></button>` : "")
    + menu.categories.map((c, i) => `<button class="tab ${tab === i && !query ? "on" : ""}" data-tab="${i}">${esc(c.emoji || "")} ${esc(c.name)}<span class="cnt">${c.items.length}</span></button>`).join("");
  if (tab === -1 && !nSel) tab = 0;

  let groups;
  if (query) {
    const q = query.toLowerCase();
    groups = menu.categories.map((c) => ({ c, items: c.items.filter((it) =>
      String(it.n) === q || String(it.code || "") === q || it.name.toLowerCase().includes(q) || it.original.toLowerCase().includes(q)) }))
      .filter((g) => g.items.length);
  } else if (tab === -1) {
    const ns = [...new Set(lines.map((l) => l.n))];
    groups = [{ c: null, items: ns.map((n) => byN.get(n)) }];
  } else {
    groups = [{ c: menu.categories[tab], items: menu.categories[tab].items }];
  }

  let html = "";
  for (const g of groups) {
    if (g.c && (query || g.c.original)) html += `<div class="cat">${esc(g.c.emoji || "")} ${esc(g.c.name)} ${esc(g.c.original || "")}</div>`;
    for (const it of g.items) html += rowHtml(it);
  }
  if (!html) html = `<div class="empty">${query ? T.noResult : T.none}</div>`;
  if (!query && tab >= 0 && menu.notes?.length && tab === menu.categories.length - 1) {
    html += `<div class="notes" style="padding:10px 14px">${menu.notes.map(esc).join("<br>")}</div>`;
  }
  $("list").innerHTML = html;

  const t = totals(lines);
  $("sum").innerHTML = t.count ? `${T.selected} ${t.count} · ${T.total} <b>${money(t.sum)}</b>${t.unknown ? " +?" : ""}` : `<span style="color:var(--muted)">${T.none}</span>`;
  const btn = $("cardBtn");
  btn.textContent = T.card;
  btn.disabled = !t.count;

  if (placed.length) {
    const p = totals(placed);
    $("placed").classList.remove("hidden");
    $("placedText").textContent = T.placedLine(p.count, money(p.sum) + (p.unknown ? " +?" : ""));
    $("billBtn").textContent = T.bill;
  } else $("placed").classList.add("hidden");
}

function rowHtml(it) {
  const q = qtyOf(it.n);
  const tag = it.tag === "must" ? "🏅 " : it.tag === "star" ? "⭐ " : "";
  const miss = lines.some((l) => l.n === it.n && needsChoice(l));
  let h = `<div class="row" data-n="${it.n}">
    <div class="num">${it.n}</div>
    <div class="main" data-toggle="${it.n}">
      <div class="name-row"><span class="name">${tag}${esc(it.name)}</span><span class="price">${esc(it.price)}</span></div>
      ${it.original && it.original !== it.name ? `<div class="orig">${esc(it.original)}</div>` : ""}
      ${it.desc ? `<div class="desc">${esc(it.desc)}</div>` : ""}
      ${miss ? `<div class="need">${T.pick}: ${it.options.map((o) => esc(o.label)).join(" / ")}</div>` : ""}
    </div>
    <div class="step">
      ${q ? `<button data-sub="${it.n}" aria-label="−">−</button><span class="q">${q}</span>` : ""}
      <button class="plus" data-add="${it.n}" aria-label="+">+</button>
    </div>
  </div>`;
  if (q && open.has(it.n)) h += panelHtml(it);
  return h;
}

function panelHtml(it) {
  const ls = lines.filter((l) => l.n === it.n);
  const reqs = menu.requests || [];
  let h = `<div class="panel">`;
  ls.forEach((l, i) => {
    const li = lines.indexOf(l);
    h += `<div class="line">`;
    if (ls.length > 1) h += `<div class="line-head"><span>${T.portion(i + 1)} · ×${l.qty}</span>
      <span class="step"><button data-lsub="${li}">−</button><button class="plus" data-ladd="${li}">+</button></span></div>`;
    if (it.options?.length) h += `<div class="chips"><span class="lab need-lab">${T.required}</span>${it.options.map((o, oi) =>
      `<button class="chip ${l.opt === oi ? "on" : ""}" data-opt="${li}:${oi}">${esc(o.label)}</button>`).join("")}</div>`;
    if (it.extras?.length) h += `<div class="chips"><span class="lab">${T.optional}</span>${it.extras.map((x, xi) =>
      `<button class="chip ${(l.ext || []).includes(xi) ? "on" : ""}" data-ext="${li}:${xi}">${esc(x.label)}</button>`).join("")}</div>`;
    if (reqs.length) h += `<div class="chips">${reqs.map((r, ri) =>
      `<button class="chip req ${l.reqs.includes(ri) ? "on" : ""}" data-req="${li}:${ri}">${esc(r.label)}</button>`).join("")}</div>`;
    h += `</div>`;
  });
  h += `<button class="split" data-split="${it.n}">${T.split}</button></div>`;
  return h;
}

// ---- Render: card ----
// 一份菜的全部附加：必选 → 可选 → 通用要求
function picks(l, it) {
  const reqs = menu.requests || [];
  const out = [];
  if (l.opt != null && it.options?.[l.opt]) out.push(it.options[l.opt]);
  for (const xi of l.ext || []) if (it.extras?.[xi]) out.push(it.extras[xi]);
  for (const ri of l.reqs) if (reqs[ri]) out.push(reqs[ri]);
  return out;
}
function cardLines(ls) {
  // 同一道菜、同选项、同要求合并
  const out = [];
  for (const l of ls) {
    const key = `${l.n}|${l.opt}|${[...(l.ext || [])].sort().join(",")}|${[...l.reqs].sort().join(",")}`;
    const hit = out.find((o) => o.key === key);
    if (hit) hit.qty += l.qty; else out.push({ ...l, key });
  }
  return out;
}

function renderCard() {
  const c = menu.card || {};
  const isBill = view === "bill";
  const ls = cardLines(isBill ? placed : lines);
  const reqs = menu.requests || [];
  let w = "";
  if (isBill) {
    w += `<div class="w-open">${esc(c.bill)}</div>`;
  } else {
    w += `<div class="w-open">${esc(round > 0 ? c.add : c.opening)}</div>`;
    if (c.english) w += `<div class="w-en">${round > 0 ? "We'd like to add these, please." : esc(c.english)}</div>`;
    if (c.allergy) w += `<div class="w-allergy">${esc(c.allergy)}</div>`;
    w += `<div class="w-items">`;
    for (const l of ls) {
      const it = byN.get(l.n);
      w += `<div class="w-item">・${it.code ? `No.${esc(it.code)} ` : ""}${esc(it.original)} ×${l.qty}</div>`;
      for (const x of picks(l, it)) w += `<div class="w-sub">${esc(x.local)}</div>`;
      if (it.ask) w += `<div class="w-sub">${esc(it.ask)}</div>`;
    }
    w += `</div>`;
  }
  $("waiter").innerHTML = w;

  let t = `<table>`;
  for (const l of ls) {
    const it = byN.get(l.n);
    const extra = picks(l, it).map((x) => x.label).join("、");
    const price = typeof it.value === "number" ? money(it.value * l.qty) : esc(it.price);
    t += `<tr><td>${it.n}</td><td>${esc(it.name)}${extra ? `<div class="orig">${esc(extra)}</div>` : ""}</td><td class="r">×${l.qty}</td><td class="r">${price}</td></tr>`;
  }
  const tt = totals(isBill ? placed : lines);
  t += `<tr class="tot"><td></td><td>${T.total}</td><td class="r">${tt.count}</td><td class="r">${money(tt.sum)}</td></tr></table>`;
  if (tt.unknown) t += `<div class="notes">${T.incomplete}</div>`;
  if (menu.notes?.length) t += `<div class="notes">${menu.notes.map(esc).join("<br>")}</div>`;
  $("confirm").innerHTML = t;

  $("topBack").textContent = `‹ ${isBill ? T.close : T.back}`;
  $("topLabel").textContent = isBill ? T.bill : T.showWaiter;
  $("actions").classList.toggle("hidden", isBill);
  $("actions").innerHTML = isBill ? "" : `<button class="btn" data-act="placed">${T.placedBtn}</button>`;
}

function orderText() {
  const reqs = menu.requests || [];
  const fmt = (ls) => cardLines(ls).map((l) => {
    const it = byN.get(l.n);
    const extra = picks(l, it).map((x) => x.label).join(", ");
    return `#${it.n} ${it.name} (${it.original}) x${l.qty}${extra ? ` [${extra}]` : ""}`;
  }).join("; ");
  const p = totals(placed);
  return `Menu Helper order at ${menu.restaurant}. Ordered: ${fmt(placed) || "none"}. Total ${money(p.sum)}${p.unknown ? " (incomplete)" : ""}. In cart, not yet ordered: ${fmt(lines) || "none"}.`;
}
async function syncModel() {
  const text = orderText();
  await ready;
  try { await request("ui/update-model-context", { content: [{ type: "text", text }] }); } catch {}
}
async function fullscreen(on) {
  await ready;
  const mode = on ? "fullscreen" : "inline";
  try { const r = await request("ui/request-display-mode", { mode }); displayMode = r?.mode || mode; }
  catch { try { await window.openai?.requestDisplayMode?.({ mode }); displayMode = mode; } catch {} }
  applyInsets();
}

// ---- Events ----
document.addEventListener("click", (e) => {
  const b = e.target.closest("button, [data-toggle]");
  if (!b) return;
  const d = b.dataset;
  if (d.tab !== undefined) { tab = Number(d.tab); query = ""; $("search").value = ""; render(); $("list").scrollTop = 0; return; }
  if (d.add) return add(Number(d.add));
  if (d.sub) return sub(Number(d.sub));
  if (d.toggle) { const n = Number(d.toggle); if (qtyOf(n)) { open.has(n) ? open.delete(n) : open.add(n); render(); } return; }
  if (d.ladd) { lines[Number(d.ladd)].qty++; return changed(); }
  if (d.lsub) { const l = lines[Number(d.lsub)]; l.qty--; if (l.qty <= 0) lines.splice(lines.indexOf(l), 1); return changed(); }
  if (d.opt) { const [li, oi] = d.opt.split(":").map(Number); lines[li].opt = lines[li].opt === oi ? null : oi; return changed(); }
  if (d.req) {
    const [li, ri] = d.req.split(":").map(Number); const r = lines[li].reqs;
    r.includes(ri) ? r.splice(r.indexOf(ri), 1) : r.push(ri); return changed();
  }
  if (d.ext) {
    const [li, xi] = d.ext.split(":").map(Number); const l = lines[li]; l.ext = l.ext || [];
    const it = byN.get(l.n); const g = it.extras[xi].group;
    if (l.ext.includes(xi)) l.ext.splice(l.ext.indexOf(xi), 1);
    else { if (g) l.ext = l.ext.filter((k) => it.extras[k].group !== g); l.ext.push(xi); }
    return changed();
  }
  if (d.split) { lines.push({ n: Number(d.split), qty: 1, opt: null, ext: [], reqs: [] }); return changed(); }
  if (b.id === "cardBtn") {
    const miss = lines.find(needsChoice);
    if (miss) {
      const cat = menu.categories.findIndex((c) => c.items.some((it) => it.n === miss.n));
      tab = cat; query = ""; open.add(miss.n); render();
      document.querySelector(`.row[data-n="${miss.n}"]`)?.scrollIntoView({ block: "center" });
      return;
    }
    view = "card"; render(); window.scrollTo(0, 0); fullscreen(true); return;
  }
  if (b.id === "billBtn") { view = "bill"; render(); window.scrollTo(0, 0); fullscreen(true); return; }
  if (d.act === "back") { view = "menu"; render(); fullscreen(false); return; }
  if (d.act === "placed") {
    round++;
    for (const l of lines) placed.push({ ...l, ext: [...(l.ext || [])], reqs: [...l.reqs] });
    lines = []; open.clear(); tab = Math.max(tab, 0);
    view = "menu"; saveState(); render(); syncModel(); fullscreen(false);
  }
});
$("search").addEventListener("input", (e) => { query = e.target.value.trim(); render(); });

// ChatGPT 扩展：已有数据时直接渲染
try { if (window.openai?.toolOutput) load(window.openai.toolOutput); } catch {}
window.addEventListener("openai:set_globals", () => { try { load(window.openai?.toolOutput); } catch {} });
</script>
