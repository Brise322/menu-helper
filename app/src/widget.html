<!DOCTYPE html>
<!-- widget.html — 菜单组件页面骨架。部署时 bundle.js 把 widget.css、widget-app.js 内联进来 -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="widget.css">
</head>
<body>
<div id="loading" class="empty">…</div>

<!-- 菜单页 -->
<div id="menuView" class="hidden">
  <header>
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
    <div class="intro" id="intro"></div>
    <input class="search" id="search" type="search" autocomplete="off">
  </header>
  <div class="placed hidden" id="placed"><span id="placedText"></span><button id="billBtn"></button></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="list"></div>
  <div class="bar">
    <div class="sum" id="sum"></div>
    <button class="btn" id="cardBtn"></button>
  </div>
</div>

<!-- 卡片页：点菜卡片 / 结账卡片 -->
<div id="cardView" class="hidden">
  <div class="card-top"><button data-act="back" id="topBack"></button><span id="topLabel"></span></div>
  <div class="waiter" id="waiter"></div>
  <div class="confirm" id="confirm"></div>
  <div class="actions" id="actions"></div>
</div>

<script type="module" src="widget-app.js"></script>
</body>
</html>
